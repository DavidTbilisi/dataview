[project]
name = "dv"
version = "0.1.0"
description = "Personal terminal dataview tool"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.26.7",
]

[project.scripts]
dv = "dv.main:cli"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
